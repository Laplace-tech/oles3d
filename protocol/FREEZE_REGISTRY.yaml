      - claim_level_literature_matrix
      - advisor_review
    forbidden_evidence:
      - test_metrics
  - id: G1_geometry_plan_and_compute
    due: 2026-09-14
    decides:
      - train_validation_eligible_manifest
      - frozen_test_eligibility_rule
      - nine_or_six_label_path
      - candidate_pool_storage_cap
      - dynamic_worker_or_static_pivot
      - planner_derived_or_named_6GB_or_3mm_plan
      - torch_compile_setting
      - fixed_equal_update_budget
      - worker_count
      - primary_seed_ceiling_and_compute_tier
    allowed_evidence:
      - train_validation_metadata_and_geometry_audit
      - candidate_pool_simulation_at_candidate_final_plan_grid
      - storage_and_IPC_benchmark
      - official_five_epoch_benchmark
      - runtime_VRAM_RAM_projection
    forbidden_evidence:
      - test_aggregate_label_coverage
      - test_predictions_or_metrics
      - sampling_method_performance
  - id: G2_reference_and_controller_constants
    due: 2026-09-20
    decides:
      - unmodified_sampler_reference_pass
      - telemetry_minimum_observation
      - stale_state_horizon
      - probability_floor_and_cap
    allowed_evidence:
      - synthetic_distribution_tests
      - one_case_overfit
      - B0_train_validation_learning_and_error_coverage
      - B0_runtime_projection_check
      - test_file_integrity_and_geometry_under_frozen_rule
    forbidden_evidence:
      - test_predictions_or_metrics
      - test_aggregate_coverage_for_label_choice
      - B1_or_P_screening_ranking
  - id: G3_method_feasibility
    due: 2026-09-25
    decides:
      - dynamic_controller_feasible_or_matched_static_pivot
    allowed_evidence:
      - synthetic_sampling_and_alignment_tests
      - shared_memory_worker_histogram
      - first_ten_percent_training_prefix
      - runtime_VRAM_RAM_overhead
    forbidden_evidence:
      - test_predictions_or_metrics
  - id: G4_signal_and_track
    due: 2026-09-30
    decides:
      - Track_A_method_or_Track_B_controlled_empirical
    allowed_evidence:
      - frozen_validation_screening_prefix
      - controller_logs_and_failure_panels
    forbidden_evidence:
      - test_predictions_or_metrics
  - id: G5_result_freeze
    due: 2026-10-12
    decides:
      - final_tables_figures_and_claim_level
    allowed_evidence:
      - locked_run_artifacts

scope_forbidden_before_submission:
  - new_backbone
  - new_loss
  - method_specific_augmentation
  - transformer_or_foundation_model
  - second_dataset
  - DICOM_or_PACS_pipeline
  - web_or_mobile_application
  - clinical_deployment_claim

change_control:
  log: docs/DECISION_LOG.md
  rule: every_change_requires_date_evidence_and_protocol_impact
