schema_version: 1
project: OLES3D
registry_status: preregistration_draft
snapshot_date: 2026-09-04
timezone: Asia/Seoul
internal_submission_deadline: "2026-10-22T18:00:00+09:00"

fixed_now:
  task: 3D_abdominal_CT_multiclass_segmentation
  dataset_record: TotalSegmentator_v2.0.1
  official_split_required: true
  framework: nnU-Net_v2
  changed_component: training_patch_center_policy_only
  target_labels_9:
    - spleen
    - kidney_right
    - kidney_left
    - gallbladder
    - liver
    - stomach
    - pancreas
    - adrenal_gland_right
    - adrenal_gland_left
  fallback_labels_6:
    - spleen
    - kidney_right
    - kidney_left
    - gallbladder
    - liver
    - pancreas
  fallback_trigger:
    decision_partitions:
      - train
      - validation
    minimum_complete_cases:
      train: 100
      validation: 20
    adrenal_empty_stratum_fraction_at_frozen_plan_grid: 0.20
    test_can_change_label_path: false
  common_laterality_policy:
    training_mirroring: false
    inference_tta: false
  exact_torch_2_9_0_allowed_without_benchmark: false
  minimum_training_vram_headroom_gib: 0.75
  initial_workers:
    fingerprint: 1
    preprocessing: 1
    data_augmentation: 1
    inference: 1
    metrics: 1
    candidate_pool_generation: 1
  worker_increase_gate:
    maximum_each: 2
    peak_host_ram_gib_at_most: 10
    swap_increase_gib_less_than: 0.25
  candidate_pool_tau_mm: 3.0
  adaptive_mixture_lambda: 0.5
  warmup_fraction_of_updates: 0.10
  controller_constants:
    ema_decay: 0.9
    progress_lag_epochs: 1
    policy_update_interval_epochs: 1
    epsilon: 1.0e-8
    unseen_state_initialization: uniform_prior
    normalization: positive_priority_over_case_eligible_strata
    branch_schedule: seeded_epoch_shuffled_exact_mixture_consumed_by_atomic_draw_id
    branch_sample_slot_aliasing_allowed: false
    B1_runs_matched_telemetry_but_state_affects_sampling: false
  primary_methods:
    - B0_unmodified_sampler_reference
    - B1_matched_static_semantic_pool
    - P_OLES3D
  optional_diagnostics:
    - A1_no_progress
    - A2_organ_aggregate_error
  primary_endpoint: patient_case_macro_selected_organ_Dice_P_minus_B0
  primary_organ_count_default: 9
  primary_organ_count_if_fallback: 6
  primary_checkpoint: fixed_final_update
  primary_metric_grid: restored_original_physical_grid
  test_metric_and_prediction_access: once_after_pretest_code_cohort_metric_freeze
  method_order_if_three_seeds:
    seed0: [B0, B1, P]
    seed1: [B1, P, B0]
    seed2: [P, B0, B1]
  equal_update_budget_candidates_descending: [50000, 37500, 25000, 12500]
  compute_contingency_order:
    - delete_A2_then_A1
    - delete_midpoint_full_volume_validation
    - reuse_screening_as_confirmation_prefix
    - reduce_equal_update_budget_preserving_three_matched_seeds
    - B0_P_three_seeds_and_B1_one_seed_with_exploratory_B1_claim
    - B0_B1_P_one_seed_conditional_descriptive_Track_B
  conditional_inference:
    P_B0_three_seeds: primary_patient_seed_two_way_bootstrap_allowed
    all_primary_three_seeds: H2_and_controller_added_value_claim_allowed
    B1_one_seed: P_minus_B1_exploratory_no_controller_added_value_claim
    all_primary_one_seed: patient_bootstrap_conditional_on_observed_seed_no_repeated_effect_claim

pending_blind_gates:
